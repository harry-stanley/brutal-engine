name: Bug report
description: Something in BrutalEngine doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search existing issues first.
        **Security issues must not be reported here.** See [SECURITY.md](https://github.com/harry-stanley/brutal-engine/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Engine version
      description: The BrutalEngine package version, or the commit SHA if you built from source.
      placeholder: 0.1.0, or commit 975f777
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options:
        - Windows (x64)
        - Linux (x64)
        - macOS (arm64)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and .NET SDK version
      placeholder: Windows 11 24H2, .NET SDK 11.0.100
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver version
      description: Required for graphics issues. Include the Vulkan SDK version if validation layers are involved.
      placeholder: NVIDIA GeForce RTX 2070 SUPER, driver 581.xx
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest code or project that shows the problem, and the steps to run it.
      placeholder: |
        1. Create a game with ...
        2. Run `dotnet run` ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behaviour
      description: What you expected to happen, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Full exception and stack trace, engine log output and any validation-layer messages.
      render: text
    validations:
      required: false
