version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: scope
    groups:
      brutal:
        patterns: ["Ahwoo.Brutal.*"]
      testing:
        patterns: ["xunit*", "CsCheck", "Microsoft.Testing.*"]
      build-tooling:
        patterns: ["MinVer", "Microsoft.CodeAnalysis.*"]

  - package-ecosystem: dotnet-sdk
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
    # ADR-0001: the engine targets .NET 10 LTS. Only propose patch/feature-band SDK updates
    # within 10.0.x; moving to a new major SDK is a deliberate decision recorded in a new ADR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
