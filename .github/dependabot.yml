version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: scope
    groups:
      brutal:
        patterns: ["Ahwoo.Brutal.*"]
      testing:
        patterns: ["xunit*", "CsCheck", "Microsoft.Testing.*"]
      build-tooling:
        patterns: ["MinVer", "Microsoft.CodeAnalysis.*"]

  - package-ecosystem: dotnet-sdk
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
