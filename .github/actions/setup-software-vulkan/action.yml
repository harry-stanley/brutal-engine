name: Set up software Vulkan
description: >-
  Installs the Vulkan loader, Mesa lavapipe (a CPU Vulkan 1.3+ driver) and the Khronos validation layers on a
  GitHub-hosted runner, so GPU tests can run without a GPU. Linux and Windows only. The setup and pinned versions
  come from spike S3 (docs/spikes/README.md). macOS uses bundled MoltenVK instead (setup-macos-vulkan).
  The validation layers come from the LunarG SDK on both OSes, at the same pinned version: on Linux the loader and
  lavapipe stay Ubuntu's, but Ubuntu's layers (1.3.275 on ubuntu-24.04) race device creation and destruction on
  other threads, which crashes parallel GPU tests (#457). On both OSes the files the tests use are cached, keyed on
  the pinned versions, so the Mesa archive and the LunarG SDK are only downloaded when a pin changes.

runs:
  using: composite
  steps:
    - name: Install the loader and lavapipe (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        # vulkan-tools: vulkaninfo, which the layer registration below uses to check the layer the loader loads.
        packages="libvulkan1 mesa-vulkan-drivers vulkan-tools"

        has_candidates() {
          for p in $packages; do
            apt-cache policy "$p" | grep -q 'Candidate: [^(]' || return 1
          done
        }

        # Hosted runners occasionally come up with no Ubuntu archive in their apt sources (only the
        # Microsoft repo), so the packages have no install candidate. Retry, then fall back to the
        # standard Ubuntu archive rather than failing on runner configuration.
        for attempt in 1 2 3; do
          sudo apt-get update -q || true
          if has_candidates; then break; fi
          echo "::warning::Vulkan packages have no apt candidate (attempt $attempt). Sources:"
          ls -la /etc/apt/sources.list.d/ || true
          if [ "$attempt" -eq 2 ]; then
            echo "Adding the standard Ubuntu archive as a fallback apt source."
            printf '%s\n' \
              'Types: deb' \
              'URIs: http://archive.ubuntu.com/ubuntu' \
              "Suites: $(lsb_release -cs) $(lsb_release -cs)-updates $(lsb_release -cs)-security" \
              'Components: main universe' \
              'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
              | sudo tee /etc/apt/sources.list.d/brutalengine-ubuntu-fallback.sources > /dev/null
          fi
          sleep 5
        done
        has_candidates || { echo "::error::Vulkan packages are unavailable from apt."; exit 1; }

        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends $packages
        dpkg -l $packages | tail -n +6
        # The ICD file name differs between Mesa builds (lvp_icd.json vs lvp_icd.x86_64.json).
        icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)
        test -n "$icd"
        echo "Using lavapipe ICD: $icd"
        echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"

    # Linux: the Khronos validation layer from the LunarG Linux SDK, pinned + SHA-256, at the Windows SDK's version. Bump
    # LAYOUT when the cached file set changes, so an old cache isn't reused.
    - name: Pin the Linux validation layers
      id: linux-pins
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sdk_version=1.4.363.1
        sdk_sha256=b7867d8ca658563813af666f34b93db87f1b1c7d9d69d97e924c210c7ba33eb8
        layout=1
        key="vulkan-linux-x64-sdk-$sdk_version-layout$layout"
        echo "Cache key: $key"
        { echo "sdk_version=$sdk_version"; echo "sdk_sha256=$sdk_sha256"; echo "key=$key"; } >> "$GITHUB_OUTPUT"

    - name: Restore the Linux validation layers
      id: linux-restore
      if: runner.os == 'Linux'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/vulkan-ci
        key: ${{ steps.linux-pins.outputs.key }}

    # Only the layer library and its manifest are kept, in the SDK's own layout, so the manifest's relative library path
    # still resolves. The library ships with its debug sections (about 410 MB); they are stripped (about 40 MB) to keep
    # the cache small. Its build ID stays, so a crash can still be symbolized against the pinned SDK.
    - name: Download the Linux validation layers (cache miss)
      if: runner.os == 'Linux' && steps.linux-restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        VULKAN_SDK_VERSION: ${{ steps.linux-pins.outputs.sdk_version }}
        VULKAN_SDK_SHA256: ${{ steps.linux-pins.outputs.sdk_sha256 }}
      run: |
        set -euo pipefail
        v=$VULKAN_SDK_VERSION
        archive="$RUNNER_TEMP/vulkansdk.tar.xz"
        curl -fsSL --retry 3 -o "$archive" "https://sdk.lunarg.com/sdk/download/$v/linux/vulkansdk-linux-x86_64-$v.tar.xz"
        hash=$(sha256sum "$archive" | cut -d' ' -f1)
        if [ "$hash" != "$VULKAN_SDK_SHA256" ]; then
          echo "::error::Vulkan SDK SHA-256 mismatch: $hash"
          exit 1
        fi
        lib=x86_64/lib/libVkLayer_khronos_validation.so
        manifest=x86_64/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json
        mkdir -p "$HOME/vulkan-ci/sdk"
        tar -xJf "$archive" -C "$HOME/vulkan-ci/sdk" --strip-components=1 "$v/$lib" "$v/$manifest"
        rm "$archive"
        strip --strip-debug "$HOME/vulkan-ci/sdk/$lib"
        ls -lR "$HOME/vulkan-ci"

    - name: Save the Linux validation layers
      if: runner.os == 'Linux' && steps.linux-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/vulkan-ci
        key: ${{ steps.linux-pins.outputs.key }}

    # VK_LAYER_PATH replaces the loader's own search for explicit layers, so no other copy of the layer can be found.
    # The check loads the layer the way the tests do and fails unless the loader took the library from the pinned SDK
    # and reports the pinned version, so a fallback to another layer can't pass silently.
    - name: Register the validation layers (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        VULKAN_SDK_VERSION: ${{ steps.linux-pins.outputs.sdk_version }}
      run: |
        set -euo pipefail
        layers="$HOME/vulkan-ci/sdk/x86_64/share/vulkan/explicit_layer.d"
        expected=${VULKAN_SDK_VERSION%.*}
        status=0
        out=$(VK_LAYER_PATH="$layers" VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation VK_LOADER_DEBUG=layer \
          vulkaninfo --summary 2>&1) || status=$?
        loaded=$(grep -oE 'Insert instance layer "VK_LAYER_KHRONOS_validation" \(.*\)' <<< "$out" || true)
        version=$(awk '$1 == "VK_LAYER_KHRONOS_validation" { for (i = 2; i <= NF; i++) if ($i ~ /^[0-9]+[.][0-9]+[.][0-9]+$/) { print $i; exit } }' <<< "$out")
        echo "Loaded: ${loaded:-no VK_LAYER_KHRONOS_validation}"
        echo "Validation layer version: ${version:-none} (pinned: $expected)"
        if [ "$status" -ne 0 ] || [[ $loaded != *"($HOME/vulkan-ci/sdk/"* ]] || [ "$version" != "$expected" ]; then
          printf '%s\n' "$out" | tail -n 40
          echo "::error::The loader didn't load the pinned validation layer $expected from $layers (vulkaninfo exit $status)."
          exit 1
        fi
        echo "VK_LAYER_PATH=$layers" >> "$GITHUB_ENV"

    # Windows: lavapipe from pal1000/mesa-dist-win, and the loader and validation layers from the LunarG SDK, both
    # pinned + SHA-256. Bump LAYOUT when the cached file set changes, so an old cache isn't reused.
    - name: Pin the Windows Vulkan components
      id: pins
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $pins = [ordered]@{
          mesa_version   = '26.3.1'
          mesa_sha256    = '64e84cf13d67dd354640bf443ed0445e6a83afd06a5729f0750b3744d633b3f1'
          sdk_version    = '1.4.363.1'
          sdk_sha256     = 'c02932bd9a968b22d404536108adaacac908c081cd6b0113f5bfefc523dd0a6a'
        }
        $layout = 1
        foreach ($name in $pins.Keys) { "$name=$($pins[$name])" >> $env:GITHUB_OUTPUT }
        $key = "vulkan-windows-x64-mesa-$($pins.mesa_version)-sdk-$($pins.sdk_version)-layout$layout"
        "Cache key: $key"
        "key=$key" >> $env:GITHUB_OUTPUT

    - name: Restore the Windows Vulkan components
      id: restore
      if: runner.os == 'Windows'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: C:\vulkan-ci
        key: ${{ steps.pins.outputs.key }}

    - name: Download the Windows Vulkan components (cache miss)
      if: runner.os == 'Windows' && steps.restore.outputs.cache-hit != 'true'
      shell: pwsh
      env:
        MESA_VERSION: ${{ steps.pins.outputs.mesa_version }}
        MESA_SHA256: ${{ steps.pins.outputs.mesa_sha256 }}
        VULKAN_SDK_VERSION: ${{ steps.pins.outputs.sdk_version }}
        VULKAN_SDK_SHA256: ${{ steps.pins.outputs.sdk_sha256 }}
      run: |
        $ErrorActionPreference = 'Stop'
        $root = 'C:\vulkan-ci'

        # lavapipe: the driver DLL and its ICD manifest, which names the DLL by a relative path.
        $archive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
        Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z" -OutFile $archive
        $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($hash -ne $env:MESA_SHA256) { throw "mesa-dist-win SHA-256 mismatch: $hash" }
        & 7z e $archive "-o$root\mesa" x64\vulkan_lvp.dll x64\lvp_icd.x86_64.json -y | Out-Null
        if ($LASTEXITCODE -ne 0) { throw '7z extraction failed' }

        # LunarG SDK: install it to a temporary folder, then keep only the validation layer and the loader.
        $v = $env:VULKAN_SDK_VERSION
        $installer = Join-Path $env:RUNNER_TEMP 'vulkansdk.exe'
        Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$v/windows/vulkansdk-windows-X64-$v.exe" -OutFile $installer
        $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($hash -ne $env:VULKAN_SDK_SHA256) { throw "Vulkan SDK SHA-256 mismatch: $hash" }
        $sdk = Join-Path $env:RUNNER_TEMP "VulkanSDK\$v"
        $process = Start-Process -FilePath $installer -ArgumentList '--root', $sdk, '--accept-licenses', '--default-answer', '--confirm-command', 'install' -Wait -PassThru -NoNewWindow
        if ($process.ExitCode -ne 0) { throw "Vulkan SDK install failed with exit code $($process.ExitCode)" }

        New-Item -ItemType Directory -Path "$root\sdk\Bin" -Force | Out-Null
        # The layer manifest names its DLL by a relative path, so the two stay side by side.
        Copy-Item "$sdk\Bin\VkLayer_khronos_validation.dll", "$sdk\Bin\VkLayer_khronos_validation.json" "$root\sdk\Bin"
        # The installer puts the loader (the Vulkan runtime) in System32, not in the SDK's Bin folder.
        $loader = "$sdk\Bin\vulkan-1.dll", 'C:\Windows\System32\vulkan-1.dll' | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $loader) { throw 'The Vulkan SDK install left no vulkan-1.dll' }
        Copy-Item $loader "$root\sdk\vulkan-1.dll"
        Get-ChildItem $root -Recurse -File | Format-Table FullName, Length -AutoSize | Out-String -Width 200

    # Saved straight away, so a failing smoke test doesn't discard it. Small (tens of MB) and keyed on the pins,
    # so pull requests may save it too.
    - name: Save the Windows Vulkan components
      if: runner.os == 'Windows' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: C:\vulkan-ci
        key: ${{ steps.pins.outputs.key }}

    - name: Register lavapipe, the loader and the validation layers (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $root = 'C:\vulkan-ci'

        function Set-RegistryKey([string] $Path) {
          # New-Item -Force on an existing registry key would delete its values.
          if (-not (Test-Path $Path)) { New-Item -Path $Path -Force | Out-Null }
        }

        # Runner processes are elevated, and the loader ignores VK_DRIVER_FILES for elevated processes,
        # so the driver is registered in HKLM.
        $drivers = 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers'
        $icd = "$root\mesa\lvp_icd.x86_64.json"
        Set-RegistryKey $drivers
        New-ItemProperty -Path $drivers -Name $icd -PropertyType DWord -Value 0 -Force | Out-Null

        # BRUTAL loads vulkan-1.dll from System32 only (Brutal.Vulkan/ImportResolver.cs). Install the pinned loader
        # there unless the same or a newer one is already present, as the SDK installer does.
        function Get-FileVersion([string] $Path) {
          $info = (Get-Item $Path).VersionInfo
          [version]::new($info.FileMajorPart, $info.FileMinorPart, $info.FileBuildPart, $info.FilePrivatePart)
        }
        $pinned = "$root\sdk\vulkan-1.dll"
        $system = 'C:\Windows\System32\vulkan-1.dll'
        if (-not (Test-Path $system) -or (Get-FileVersion $system) -lt (Get-FileVersion $pinned)) {
          Copy-Item $pinned $system -Force
        }
        "Vulkan loader: $system $(Get-FileVersion $system)"

        # Register exactly one Khronos validation layer: ours. On a cache miss the SDK installer may have
        # registered its own copy from the temporary install folder.
        $layers = 'HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers'
        $layerJson = "$root\sdk\Bin\VkLayer_khronos_validation.json"
        Set-RegistryKey $layers
        (Get-Item $layers).GetValueNames() |
          Where-Object { $_ -like '*VkLayer_khronos_validation.json' -and $_ -ne $layerJson } |
          ForEach-Object { Remove-ItemProperty -Path $layers -Name $_ }
        New-ItemProperty -Path $layers -Name $layerJson -PropertyType DWord -Value 0 -Force | Out-Null

        "VK_DRIVER_FILES=$icd" >> $env:GITHUB_ENV
        "VULKAN_SDK=$root\sdk" >> $env:GITHUB_ENV

    - name: Reject unsupported runner OS
      if: runner.os != 'Linux' && runner.os != 'Windows'
      shell: bash
      run: |
        echo "::error::setup-software-vulkan supports Linux and Windows only (macOS uses setup-macos-vulkan)."
        exit 1
