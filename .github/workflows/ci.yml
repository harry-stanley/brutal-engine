name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore BrutalEngine.slnx
      - name: Check formatting
        run: dotnet format BrutalEngine.slnx --verify-no-changes --no-restore

  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer derives versions from tags and history
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore (locked)
        run: dotnet restore BrutalEngine.slnx
      - name: Build (Debug)
        run: dotnet build BrutalEngine.slnx -c Debug --no-restore
      - name: Build (Release)
        run: dotnet build BrutalEngine.slnx -c Release --no-restore
      - name: Test
        run: >-
          dotnet test --solution BrutalEngine.slnx -c Release --no-build
          --results-directory TestResults
          --report-trx
          --coverage --coverage-output-format cobertura
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14

  pack:
    name: Pack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore (locked)
        run: dotnet restore BrutalEngine.slnx
      - name: Pack (with package validation)
        run: dotnet pack BrutalEngine.slnx -c Release --no-restore -o artifacts/packages
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 14

  vulkan-smoke:
    name: Vulkan smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-2025
            rid: win-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Set up software Vulkan (lavapipe + validation layers)
        uses: ./.github/actions/setup-software-vulkan
      - name: Build smoke harness
        run: dotnet build tests/BrutalEngine.Aot.Smoke -c Release
      - name: Run (JIT, CPU device required)
        run: dotnet run --project tests/BrutalEngine.Aot.Smoke -c Release --no-build -- vulkan-offscreen --require-cpu
      - name: Negative test (JIT, injected validation error must exit 2)
        run: |
          set +e
          dotnet run --project tests/BrutalEngine.Aot.Smoke -c Release --no-build -- vulkan-offscreen --require-cpu --inject-validation-error
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 2

  # Single required status check for branch protection: passes only if every job above passed.
  ci-ok:
    name: CI passed
    if: always()
    needs: [format, build-test, pack, vulkan-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required CI job did not succeed ($result)."
              exit 1
            fi
          done
