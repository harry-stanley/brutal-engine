name: CI

# Two tiers (docs/06-ci-cd-and-release.md, "CI tiers"). Pull requests get the fast tier unless they touch
# paths that can affect native interop, NativeAOT or GPU tests. Pushes to main, the nightly schedule and
# manual runs always get the full tier.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 15 * * *" # nightly full tier, 15:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  tier:
    name: Select CI tier
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tier: ${{ steps.select.outputs.tier }}
      smoke_matrix: ${{ steps.select.outputs.smoke_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Self-test the tier rules
        run: bash .github/scripts/ci-tier-test.sh
      - name: Select tier
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Event '$EVENT_NAME' always runs the full tier."
            tier=full
          elif [ "$PR_CHANGED_FILES" -ge 3000 ]; then
            # The PR files API lists at most 3000 files, so a bigger PR can't be classified.
            echo "The PR changes $PR_CHANGED_FILES files, more than the files API lists. Running the full tier."
            tier=full
          else
            # Renames count under both the old and the new path.
            paths=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)')
            echo "Changed paths:"
            printf '%s\n' "$paths" | sed 's/^/  /'
            tier=$(printf '%s' "$paths" | bash .github/scripts/ci-tier.sh)
          fi

          linux='{"os":"ubuntu-24.04","rid":"linux-x64"}'
          windows='{"os":"windows-2025","rid":"win-x64"}'
          if [ "$tier" = "full" ]; then
            matrix="[$linux,$windows]"
          else
            matrix="[$linux]"
          fi

          echo "Tier: $tier"
          echo "Vulkan smoke matrix: $matrix"
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "smoke_matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "CI tier: **$tier** (Vulkan smoke on: $(printf '%s' "$matrix" | grep -o '"os":"[^"]*"' | cut -d'"' -f4 | paste -sd, -))" >> "$GITHUB_STEP_SUMMARY"

  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore BrutalEngine.slnx
      - name: Check formatting
        run: dotnet format BrutalEngine.slnx --verify-no-changes --no-restore

  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer derives versions from tags and history
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore (locked)
        run: dotnet restore BrutalEngine.slnx
      - name: Build (Debug)
        run: dotnet build BrutalEngine.slnx -c Debug --no-restore
      - name: Build (Release)
        run: dotnet build BrutalEngine.slnx -c Release --no-restore
      - name: Test
        run: >-
          dotnet test --solution BrutalEngine.slnx -c Release --no-build
          --results-directory TestResults
          --report-trx
          --coverage --coverage-output-format cobertura
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14

  pack:
    name: Pack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore (locked)
        run: dotnet restore BrutalEngine.slnx
      - name: Pack (with package validation)
        run: dotnet pack BrutalEngine.slnx -c Release --no-restore -o artifacts/packages
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 14

  # Linux runs in every tier. Windows (and macOS, once added) run in the full tier only.
  vulkan-smoke:
    name: Vulkan smoke, JIT + NativeAOT (${{ matrix.os }})
    needs: tier
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.tier.outputs.smoke_matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Set up software Vulkan (lavapipe + validation layers)
        uses: ./.github/actions/setup-software-vulkan
      - name: Build smoke harness
        run: dotnet build tests/BrutalEngine.Aot.Smoke -c Release
      - name: Run (JIT, CPU device required)
        run: dotnet run --project tests/BrutalEngine.Aot.Smoke -c Release --no-build -- vulkan-offscreen --require-cpu
      - name: Negative test (JIT, injected validation error must exit 2)
        run: |
          set +e
          dotnet run --project tests/BrutalEngine.Aot.Smoke -c Release --no-build -- vulkan-offscreen --require-cpu --inject-validation-error
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 2
      - name: Install NativeAOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends clang zlib1g-dev
      - name: Publish (NativeAOT, ${{ matrix.rid }})
        run: dotnet publish tests/BrutalEngine.Aot.Smoke -c Release -r ${{ matrix.rid }} -o artifacts/aot
      - name: Run (NativeAOT, CPU device required)
        run: ./artifacts/aot/BrutalEngine.Aot.Smoke vulkan-offscreen --require-cpu
      - name: Negative test (NativeAOT, injected validation error must exit 2)
        run: |
          set +e
          ./artifacts/aot/BrutalEngine.Aot.Smoke vulkan-offscreen --require-cpu --inject-validation-error
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 2

  # Single required status check for branch protection: passes only if every job above passed.
  ci-ok:
    name: CI passed
    if: always()
    needs: [tier, format, build-test, pack, vulkan-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required CI job did not succeed ($result)."
              exit 1
            fi
          done
