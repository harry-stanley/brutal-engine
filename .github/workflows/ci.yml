name: CI

# Tiers (docs/06-ci-cd-and-release.md, "CI tiers"). Pull requests get the fast tier unless they touch paths that can
# affect native interop, NativeAOT or GPU tests (full tier), or only documentation (docs tier, which skips the build).
# A push to main whose tree the merged PR already tested runs only what that PR didn't (verified or smoke-delta tier);
# any other push, the nightly schedule and manual runs always get the full tier.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 15 * * *" # nightly full tier, 15:00 UTC. Also keeps main's caches from expiring.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  tier:
    name: Select CI tier
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read # the merge check reads the merged PR's check runs
    outputs:
      tier: ${{ steps.select.outputs.tier }}
      build: ${{ steps.select.outputs.build }}
      smoke: ${{ steps.select.outputs.smoke }}
      smoke_matrix: ${{ steps.select.outputs.smoke_matrix }}
      pr_url: ${{ steps.select.outputs.pr_url }}
      proof_url: ${{ steps.select.outputs.proof_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Self-test the tier rules
        run: bash .github/scripts/ci-tier-test.sh
      - name: Self-test the merge check
        run: bash .github/scripts/ci-merge-check-test.sh
      - name: Self-test the GPU-trait discovery
        run: bash .github/scripts/gpu-tests-test.sh
      - name: Self-test the package check
        run: bash .github/scripts/check-packages-test.sh
      - name: Self-test the shader manifest finder
        run: bash .github/scripts/find-shader-manifests-test.sh
      - name: Select tier
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          # smoke_args select the device: lavapipe must be a CPU device (proves the software driver ran). Windows and
          # Linux are the tested targets (docs/adr/0015-tested-platforms-windows-linux.md).
          linux='{"os":"ubuntu-24.04","rid":"linux-x64","smoke_args":"--require-cpu"}'
          windows='{"os":"windows-2025","rid":"win-x64","smoke_args":"--require-cpu"}'

          pr_url=""
          proof_url=""
          if [ "$EVENT_NAME" != "pull_request" ]; then
            # A push to main skips what the merged PR already proved on the same tree. The check fails safe: any
            # error or doubt (and every other event) runs the full tier.
            if ! check=$(SMOKE_FAST_OS=$(jq -r .os <<< "$linux") \
              SMOKE_FULL_OS=$(jq -r .os <<< "$windows") \
              bash .github/scripts/ci-merge-check.sh); then
              echo "::warning::The merge check failed, so the full tier runs."
              check=decision=full
            fi
            field() { printf '%s\n' "$check" | sed -n "s/^$1=//p"; }
            decision=$(field decision)
            echo "Merge check: ${decision:-none} ($(field reason))."
            case "$decision" in
              verified | smoke-delta)
                tier=$decision
                pr_url=$(field pr_url)
                proof_url=$(field proof_url)
                ;;
              *)
                echo "Event '$EVENT_NAME' runs the full tier."
                tier=full
                ;;
            esac
          elif [ "$PR_CHANGED_FILES" -ge 3000 ]; then
            # The PR files API lists at most 3000 files, so a bigger PR can't be classified.
            echo "The PR changes $PR_CHANGED_FILES files, more than the files API lists. Running the full tier."
            tier=full
          else
            # Renames count under both the old and the new path.
            paths=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)')
            echo "Changed paths:"
            printf '%s\n' "$paths" | sed 's/^/  /'
            tier=$(printf '%s' "$paths" | bash .github/scripts/ci-tier.sh)
          fi

          # build: format, build, test and pack, and the cook job. smoke: the Vulkan smoke job, over smoke_matrix.
          case "$tier" in
            full) build=true smoke=true matrix="[$linux,$windows]" ;;
            fast) build=true smoke=true matrix="[$linux]" ;;
            smoke-delta) build=false smoke=true matrix="[$windows]" ;;
            # docs and verified skip the smoke job, but a matrix must still be valid JSON with at least one entry.
            docs | verified) build=false smoke=false matrix="[$linux]" ;;
            *)
              echo "::error::Unknown tier '$tier'."
              exit 1
              ;;
          esac

          echo "Tier: $tier"
          echo "Vulkan smoke matrix: $matrix"
          {
            echo "tier=$tier"
            echo "build=$build"
            echo "smoke=$smoke"
            echo "smoke_matrix=$matrix"
            echo "pr_url=$pr_url"
            echo "proof_url=$proof_url"
          } >> "$GITHUB_OUTPUT"
          smoke_os=$(printf '%s' "$matrix" | grep -o '"os":"[^"]*"' | cut -d'"' -f4 | paste -sd, -)
          case "$tier" in
            docs)
              echo "CI tier: **docs** (documentation only: format, build, test, pack, cook and Vulkan smoke skipped)" ;;
            verified)
              echo "CI tier: **verified** (same tree as $pr_url, whose [CI passed]($proof_url) in the full tier:" \
                "format, build, test, pack, cook and Vulkan smoke skipped)" ;;
            smoke-delta)
              echo "CI tier: **smoke-delta** (same tree as $pr_url, whose [CI passed]($proof_url) in the fast tier:" \
                "only the Vulkan smoke on $smoke_os runs)" ;;
            *)
              echo "CI tier: **$tier** (Vulkan smoke on: $smoke_os)" ;;
          esac >> "$GITHUB_STEP_SUMMARY"

  format:
    name: Format
    needs: tier
    if: needs.tier.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: ./.github/actions/dotnet-restore
      - name: Check formatting
        run: dotnet format BrutalEngine.slnx --verify-no-changes --no-restore

  # Pack runs here on Linux, from the Release build the tests use, rather than in a job that builds again.
  build-test:
    name: Build and test (${{ matrix.os }})
    needs: tier
    if: needs.tier.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer derives versions from tags and history
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: ./.github/actions/dotnet-restore
        with:
          save-cache: "true"
      # Debug only differs from Release in DEBUG-conditional code, which isn't OS-specific, so one OS covers it.
      - name: Build (Debug)
        if: runner.os == 'Linux'
        run: dotnet build BrutalEngine.slnx -c Debug --no-restore
      - name: Build (Release)
        run: dotnet build BrutalEngine.slnx -c Release --no-restore
      - name: Pack (with package validation)
        if: runner.os == 'Linux'
        run: dotnet pack BrutalEngine.slnx -c Release --no-build -o artifacts/packages
      # The ship gate (ADR-0016): exactly the libraries whose milestone is released were packed.
      - name: Check the packed set
        if: runner.os == 'Linux'
        run: bash .github/scripts/check-packages.sh artifacts/packages .
      # The gate's other branch: no library is above the release milestone yet, so force one and check it doesn't pack.
      # Both properties are pinned, so the probes test the comparison itself, whatever src/Directory.Build.props
      # releases: at each release, its milestone packs and the next one doesn't.
      - name: Check the ship gate excludes a later milestone
        if: runner.os == 'Linux'
        run: |
          for probe in 1:1:true 1:2:false 2:2:true 2:3:false; do
            release=${probe%%:*}
            rest=${probe#*:}
            milestone=${rest%%:*}
            want=${rest#*:}
            got=$(dotnet msbuild src/BrutalEngine.Core/BrutalEngine.Core.csproj -getProperty:IsPackable \
              -p:BrutalEngineReleaseMilestone="$release" -p:BrutalEngineMilestone="$milestone")
            echo "BrutalEngineReleaseMilestone=$release, BrutalEngineMilestone=$milestone: IsPackable=$got (expected $want)"
            if [ "$got" != "$want" ]; then
              echo "::error::With BrutalEngineReleaseMilestone=$release and BrutalEngineMilestone=$milestone, IsPackable is '$got', not '$want': check src/Directory.Build.targets (ADR-0016)."
              exit 1
            fi
          done
      - name: Upload packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 14
      # No Vulkan driver here: tests marked [Trait("Category", "Gpu")] run in the vulkan-smoke job instead.
      - name: Test
        run: >-
          dotnet test --solution BrutalEngine.slnx -c Release --no-build
          --results-directory TestResults
          --report-trx
          --coverage --coverage-output-format cobertura
          -- --filter-not-trait "Category=Gpu"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14

  # The cook tool and the built-in shaders (ADR-0012): the only job that builds BrutalEngine.Tools.slnx and restores
  # the Slang native. It re-cooks every shader that a committed shaders.cook.json lists and fails if the code differs
  # by a byte from the committed SPIR-V (docs/design/cook.md, "Manifests").
  cook:
    name: Cook tool and shader re-cook check
    needs: tier
    if: needs.tier.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: ./.github/actions/dotnet-restore
        with:
          project: BrutalEngine.Tools.slnx
      - name: Check formatting
        run: dotnet format BrutalEngine.Tools.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build BrutalEngine.Tools.slnx -c Release --no-restore
      - name: Test
        run: dotnet test --solution BrutalEngine.Tools.slnx -c Release --no-build
      - name: Re-cook the built-in shaders and compare
        run: |
          set -euo pipefail
          found=$(bash .github/scripts/find-shader-manifests.sh)
          if [ -z "$found" ]; then
            echo "::error::No shaders.cook.json found, but the cook tool's test fixture has one: check find-shader-manifests.sh."
            exit 1
          fi
          args=()
          while IFS= read -r manifest; do
            echo "Manifest: $manifest"
            args+=(--manifest "$manifest")
          done <<< "$found"
          dotnet run --project tools/BrutalEngine.Cook -c Release --no-build -- shader --check "${args[@]}"

  # Linux runs in the fast and full tiers, Windows in the full and smoke-delta tiers. The name must match
  # SMOKE_JOB_PREFIX in .github/scripts/ci-merge-check.sh, which reads it from the merged PR's check runs.
  vulkan-smoke:
    name: Vulkan smoke, JIT + NativeAOT (${{ matrix.os }})
    needs: tier
    if: needs.tier.outputs.smoke == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.tier.outputs.smoke_matrix) }}
    defaults:
      run:
        shell: bash
    env:
      SMOKE_ARGS: ${{ matrix.smoke_args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: ./.github/actions/dotnet-restore
        with:
          project: tests/BrutalEngine.Aot.Smoke
      - name: Set up software Vulkan (lavapipe + validation layers)
        uses: ./.github/actions/setup-software-vulkan
      # Tests marked [Trait("Category", "Gpu")] need a Vulkan driver, so build-test excludes them and they run here on
      # lavapipe with the validation layers. The tests run headless on Linux, which has no display (they use SDL's
      # offscreen driver), and windowed on Windows, in the runner's desktop session. gpu-tests.sh (self-tested by the
      # tier job) finds the test projects that declare the trait, and fails if one of them runs no Gpu tests.
      - name: GPU-trait tests
        run: |
          set -euo pipefail
          projects=$(bash .github/scripts/gpu-tests.sh --list)
          while read -r project; do
            [ -z "$project" ] || dotnet build "$project" -c Release
          done <<< "$projects"
          bash .github/scripts/gpu-tests.sh Release
      - name: Build smoke harness
        run: dotnet build tests/BrutalEngine.Aot.Smoke -c Release --no-restore
      # SMOKE_ARGS is split into words on purpose.
      - name: Run (JIT)
        run: dotnet run --project tests/BrutalEngine.Aot.Smoke -c Release --no-build -- vulkan-offscreen $SMOKE_ARGS
      # The engine's VulkanBackend.Create and its loader setup, with the system loader (no options).
      - name: Run graphics-vulkan (JIT)
        run: dotnet run --project tests/BrutalEngine.Aot.Smoke -c Release --no-build -- graphics-vulkan
      - name: Negative test (JIT, injected validation error must exit 2)
        run: |
          set +e
          dotnet run --project tests/BrutalEngine.Aot.Smoke -c Release --no-build -- vulkan-offscreen $SMOKE_ARGS \
            --inject-validation-error
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 2
      # --require-driver takes exactly one VkDriverId name. A comma list (OR-ed into another real ID: 1 | 2 is
      # MESARadv), a number and the MaxEnum sentinel must each be a usage error (64), not a device search.
      - name: Negative tests (smoke JIT, bad driver names must exit with the usage code)
        run: |
          failed=0
          for driver in AmdProprietary,AmdOpenSource 7 MaxEnum; do
            set +e
            dotnet run --project tests/BrutalEngine.Aot.Smoke -c Release --no-build -- vulkan-offscreen \
              --require-driver "$driver"
            code=$?
            set -e
            echo "--require-driver $driver: exit code $code"
            if [ "$code" -ne 64 ]; then
              echo "::error::--require-driver $driver exited with $code, not the usage code 64."
              failed=1
            fi
          done
          test "$failed" -eq 0
      # Every smoke runner uses lavapipe, whose driver ID is MESALlvmpipe: a valid name is still accepted in any case.
      - name: Run (JIT, driver name in any case)
        run: >-
          dotnet run --project tests/BrutalEngine.Aot.Smoke -c Release --no-build -- vulkan-offscreen $SMOKE_ARGS
          --require-driver mesallvmpipe
      # The runner image has versioned clang (clang-18 and so on) and zlib1g-dev, but no plain `clang`, which is
      # what NativeAOT invokes by default. Point NativeAOT at the newest one rather than apt-installing the
      # `clang` metapackage. Fall back to apt only if the image stops shipping them.
      - name: Find NativeAOT toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cc=$(compgen -c clang | grep -xE 'clang(-[0-9]+)?' | sort -uV | tail -n1 || true)
          if [ -z "$cc" ] || ! dpkg -s zlib1g-dev > /dev/null 2>&1; then
            echo "::warning::The runner image has no clang or zlib1g-dev; installing them."
            sudo apt-get update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends clang zlib1g-dev
            cc=clang
          fi
          echo "NativeAOT compiler and linker: $cc ($(command -v "$cc"))"
          echo "AOT_CC=$cc" >> "$GITHUB_ENV"
      - name: Publish (NativeAOT, ${{ matrix.rid }})
        run: >-
          dotnet publish tests/BrutalEngine.Aot.Smoke -c Release -r ${{ matrix.rid }} -o artifacts/aot
          ${AOT_CC:+"-p:CppCompilerAndLinker=$AOT_CC"}
      - name: Run (NativeAOT)
        run: ./artifacts/aot/BrutalEngine.Aot.Smoke vulkan-offscreen $SMOKE_ARGS
      - name: Run graphics-vulkan (NativeAOT)
        run: ./artifacts/aot/BrutalEngine.Aot.Smoke graphics-vulkan
      - name: Negative test (NativeAOT, injected validation error must exit 2)
        run: |
          set +e
          ./artifacts/aot/BrutalEngine.Aot.Smoke vulkan-offscreen $SMOKE_ARGS --inject-validation-error
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 2

      # HelloWindow (samples/HelloWindow) reuses this job's Vulkan setup and NativeAOT toolchain. Linux presents
      # headless (SDL's offscreen driver, through VK_EXT_headless_surface). No Windows driver offers that extension,
      # lavapipe included, so Windows runs windowed in the runner's desktop session and resizes the window as well.
      # --frames counts the BRUTAL splash too: headless shows it for the first 120 frames; windowed for at least 2.0 s,
      # and lavapipe presents about 700-850 frames a second there, so 3000 frames leave over a second of scene (the
      # first resize lands in the splash, the second in the scene). The run steps fail if no scene frame was presented.
      - name: Choose HelloWindow's arguments
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            args="--frames 3000 --exercise-resize --validation"
          else
            args="--headless --frames 240 --validation"
          fi
          echo "HelloWindow arguments: $args $SMOKE_ARGS"
          echo "HELLO_WINDOW_ARGS=$args" >> "$GITHUB_ENV"
      - name: Build HelloWindow
        run: dotnet build samples/HelloWindow -c Release
      # HELLO_WINDOW_ARGS and SMOKE_ARGS are split into words on purpose.
      - name: Run HelloWindow (JIT)
        run: |
          set -euo pipefail
          log=$RUNNER_TEMP/hello-window-jit.log
          dotnet run --project samples/HelloWindow -c Release --no-build -- $HELLO_WINDOW_ARGS $SMOKE_ARGS | tee "$log"
          # The splash ran, and so did the scene after it.
          grep -E ' INFO \[HelloWindow\] splash: [1-9][0-9]* frames over [0-9]+\.[0-9]{2} s, scene: [1-9][0-9]* frames$' "$log"
      - name: Negative tests (HelloWindow JIT, injected validation error must exit 2, bad option must exit 64)
        run: |
          set +e
          dotnet run --project samples/HelloWindow -c Release --no-build -- $HELLO_WINDOW_ARGS $SMOKE_ARGS \
            --inject-validation-error
          injected=$?
          dotnet run --project samples/HelloWindow -c Release --no-build -- --bogus
          usage=$?
          set -e
          echo "exit codes: injected validation error $injected, bad option $usage"
          test "$injected" -eq 2
          test "$usage" -eq 64
      - name: Publish HelloWindow (NativeAOT, ${{ matrix.rid }})
        run: >-
          dotnet publish samples/HelloWindow -c Release -r ${{ matrix.rid }} -o artifacts/hello-window/${{ matrix.rid }}
          ${AOT_CC:+"-p:CppCompilerAndLinker=$AOT_CC"}
      # BRUTAL LICENSE 1.0, 2.1, 2.3 and 4.0: its licence, a credit with its copyright line, NOTICE.txt and each
      # package's third-party licences ship with the product.
      - name: Check HelloWindow ships BRUTAL's LICENSE.txt, CREDITS.txt, NOTICE.txt and LICENSES/
        env:
          OUT: artifacts/hello-window/${{ matrix.rid }}
        run: |
          set -euo pipefail
          test -s "$OUT/LICENSE.txt"
          test -s "$OUT/NOTICE.txt"
          grep -F "BRUTAL game development framework is Copyright (c) 2024 Ahwoo Limited." "$OUT/CREDITS.txt"
          find "$OUT/LICENSES" -type f -size +0 | sort | tee "$RUNNER_TEMP/hello-window-licences.txt"
          test -s "$RUNNER_TEMP/hello-window-licences.txt"
      # Samples generate XML docs only so IDE0005 runs in the build (samples/Directory.Build.props). They aren't
      # shipped: neither HelloWindow.xml nor a referenced project's (BrutalEngine.Core.xml) is in the publish output.
      - name: Check HelloWindow ships no XML doc files
        env:
          OUT: artifacts/hello-window/${{ matrix.rid }}
        run: |
          set -euo pipefail
          test -d "$OUT"
          find "$OUT" -type f -iname '*.xml' | sort > "$RUNNER_TEMP/hello-window-xml.txt"
          if [ -s "$RUNNER_TEMP/hello-window-xml.txt" ]; then
            echo "::error::The HelloWindow publish output contains XML doc files:"
            cat "$RUNNER_TEMP/hello-window-xml.txt"
            exit 1
          fi
          echo "No *.xml files in $OUT ($(find "$OUT" -type f | wc -l) files)."
      - name: Run HelloWindow (NativeAOT)
        env:
          OUT: artifacts/hello-window/${{ matrix.rid }}
        run: |
          set -euo pipefail
          log=$RUNNER_TEMP/hello-window-aot.log
          "$OUT/HelloWindow" $HELLO_WINDOW_ARGS $SMOKE_ARGS | tee "$log"
          # The splash ran, and so did the scene after it.
          grep -E ' INFO \[HelloWindow\] splash: [1-9][0-9]* frames over [0-9]+\.[0-9]{2} s, scene: [1-9][0-9]* frames$' "$log"
      - name: Negative test (HelloWindow NativeAOT, injected validation error must exit 2)
        env:
          OUT: artifacts/hello-window/${{ matrix.rid }}
        run: |
          set +e
          "$OUT/HelloWindow" $HELLO_WINDOW_ARGS $SMOKE_ARGS --inject-validation-error
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 2
      - name: Upload HelloWindow (NativeAOT, ${{ matrix.rid }})
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hello-window-${{ matrix.rid }}
          path: artifacts/hello-window/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 14

  # Single required status check for branch protection (its name is also CI_PASSED_JOB in ci-merge-check.sh). Passes
  # only if the tier was selected and every other job passed. A job may be skipped only where its tier skips it on
  # purpose: everything in the docs and verified tiers, and format, build-test and cook in the smoke-delta tier.
  ci-ok:
    name: CI passed
    if: always()
    needs: [tier, format, build-test, cook, vulkan-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          TIER: ${{ needs.tier.outputs.tier }}
          TIER_RESULT: ${{ needs.tier.result }}
          NEEDS: ${{ toJSON(needs) }}
          PR_URL: ${{ needs.tier.outputs.pr_url }}
          PROOF_URL: ${{ needs.tier.outputs.proof_url }}
        run: |
          set -euo pipefail
          echo "Tier: ${TIER:-none} (${TIER_RESULT})."
          if [ "$TIER_RESULT" != "success" ]; then
            echo "::error::The CI tier could not be selected ($TIER_RESULT)."
            exit 1
          fi
          case "$TIER" in
            fast | full) may_skip="" ;;
            smoke-delta) may_skip="format build-test cook" ;;
            docs | verified) may_skip="format build-test cook vulkan-smoke" ;;
            *)
              echo "::error::Unknown CI tier '$TIER'."
              exit 1
              ;;
          esac
          results=$(jq -r 'to_entries[] | select(.key != "tier") | "\(.key) \(.value.result)"' <<< "$NEEDS")
          if [ -z "$results" ]; then
            echo "::error::No job results to check."
            exit 1
          fi
          failed=0
          while read -r job result; do
            echo "  $job: $result"
            case "$result" in
              success) ;;
              skipped)
                if [[ " $may_skip " != *" $job "* ]]; then
                  echo "::error::$job was skipped, which the $TIER tier doesn't allow."
                  failed=1
                fi
                ;;
              *)
                echo "::error::$job did not succeed ($result)."
                failed=1
                ;;
            esac
          done <<< "$results"
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          if [ "$TIER" = verified ] || [ "$TIER" = smoke-delta ]; then
            echo "Same tree as $PR_URL, whose CI passed: $PROOF_URL"
            echo "CI passed: same tree as $PR_URL, whose [CI passed]($PROOF_URL) ($TIER tier)." >> "$GITHUB_STEP_SUMMARY"
          fi
